[project]
name = "trust-net-port"
version = "0.1.0"
description = "Mandatory validation pipeline for AI-mediated decisions."
requires-python = ">=3.10"
dependencies = ["pydantic>=2.0.0", "fastapi>=0.104.0", "uvicorn>=0.24.0", "httpx>=0.25.0", "z3-solver>=4.12.0", "scikit-learn>=1.3.0", "numpy>=1.24.0", "pytest>=8.0.0"]

[project.optional-dependencies]
dev = ["ruff>=0.1.0", "mypy>=1.5.0", "pytest-cov>=4.1.0", "hypothesis>=6.90.0"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing"
python_files = ["test_*.py", "REG-*.py"]
pythonpath = ["src"]

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true


[project.scripts]
trustport-api = "trust_net_port.api:app"
