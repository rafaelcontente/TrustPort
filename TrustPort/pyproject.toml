[project]
name = "trust-net-port"
version = "0.1.0"
description = "Mandatory validation pipeline for AI-mediated decisions: schema, rules, SMT, conformal prediction, and explainability."
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "z3-solver>=4.12.0",
    "scikit-learn>=1.3.0",
    "numpy>=1.24.0",
    "shap>=0.44.0",
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0"
]

[project.optional-dependencies]
dev = ["ruff>=0.1.0", "mypy>=1.5.0", "pre-commit>=3.4.0"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "REG-*.py"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
